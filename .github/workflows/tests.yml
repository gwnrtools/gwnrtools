name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install black==24.10.0 flake8

      - name: Check formatting (black)
        run: black --check gwnr/ tests/ setup.py

      - name: Lint (flake8)
        run: flake8 gwnr/ tests/ setup.py --count

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Install gwnr
        run: pip install --no-deps .

      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short

      - name: Run import smoke test from installed package
        # Import outside the repo root to make sure the *installed*
        # package (not the working tree) is complete
        run: cd /tmp && python -c "import gwnr; print(gwnr.get_version_information())"
