[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gwnr"
version = "2021.9.20"
description = "A collection of tools for academic research in gravitational-wave astronomy & astrophysics"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Prayush Kumar", email = "prayush.kumar@gmail.com" }]
requires-python = ">=3.9"
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

# Direct runtime imports of the gwnr package and its installed scripts
dependencies = [
    "astropy>=2.0.16",
    "bilby",
    "emcee",
    "h5py>=2.10.0",
    "igwn-ligolw",
    "lalsuite>=6.63",
    "lscsoft-glue>=2.0.0",
    "matplotlib>=2.1",
    "numpy>=1.16.5",
    "pandas>=0.24.2",
    "pycbc",
    "pyswarm @ git+https://github.com/tisimst/pyswarm@master",
    "scipy>=1.2.3",
    "seaborn>=0.9.1",
]

[project.optional-dependencies]
dev = [
    "black==24.10.0",
    "flake8>=6.0",
    "pytest>=6.0",
]
# Used only by optional/legacy tooling, not by the package import chain:
# celluloid (SpECTRE movie rendering), romspline (bin/analysis scripts)
extras = [
    "celluloid>=0.2.0",
    "romspline>=1.1.6",
]

[project.urls]
Homepage = "https://github.com/gwnr/gwnr"
Documentation = "https://gwnr.github.io/gwnr/"

[tool.setuptools]
script-files = [
    "bin/utils/makepdf",
    "bin/banksim_generic.py",
    "bin/choose_testpoints.py",
    "bin/choose_best_testpoints.py",
    "bin/remove_eliminated_testpoints.py",
    "bin/split_table_geometrically.py",
    "bin/gwnr_create_bank_workflow",
    "bin/gwnr_create_banksim_workflow",
    "bin/gwnr_create_faithsim_workflow",
    "bin/gwnr_write_pycbc_inference_configs",
    "bin/gwnr_create_injections_pycbc_inference_workflow",
    "bin/gwnr_create_public_events_pycbc_inference_workflow",
    "bin/gwnr_write_bilby_configs",
    "bin/gwnr_create_injections_bilby_workflow",
    "bin/gwnr_create_public_events_bilby_workflow",
    "bin/gwnr_banksim",
    "bin/gwnr_faithsim",
    "bin/gwnr_force_success_from_condor_sub",
    "bin/gwnr_sample_parameter_space",
    "bin/gwnr_enigma_plan_calib_grid_and_make_dag",
    "bin/gwnr_enigma_sample_calib_parameters",
    "bin/utils/toggle_lsctable_type",
    "bin/utils/ConvertHTMLToIpynb",
    "bin/analysis/ComputeOptimalSNRForGWSignals.py",
    "bin/nr/JoinDatainHDF",
    "bin/stats/ComputeInferredParametersFromLIPosterior.py",
]

[tool.setuptools.packages.find]
include = ["gwnr*"]

[tool.setuptools.package-data]
gwnr = [".version"]
"gwnr.data" = ["gw_noise_curves/*.txt", "gw_noise_curves/*.dat"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
norecursedirs = [".*", "build", "dist", "install", "ENV", "gh-pages", "__pycache__"]
addopts = "-v --tb=short --doctest-glob=''"
markers = [
    "slow: tests that generate waveforms or run samplers (deselect with '-m \"not slow\"')",
]

[tool.black]
# black is pinned to 24.10.0 in the dev extra; run as: black gwnr/ tests/ setup.py
target-version = ["py39", "py310", "py311"]
