[tool:pytest]
minversion = 6.0
testpaths = tests
norecursedirs = .* build dist install ENV gh-pages __pycache__
addopts = -v --tb=short --doctest-glob=''
markers =
    slow: tests that generate waveforms or run samplers (deselect with '-m "not slow"')

[flake8]
# Formatting is enforced by black (pinned in pyproject.toml); flake8 is
# used as a correctness gate only, so restrict it to error classes that
# indicate real bugs: syntax errors (E9), comparison bugs (F63*),
# syntax-adjacent statement errors (F7*), and undefined names (F82*).
select = E9,F63,F7,F82
max-line-length = 88
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    gwnr.egg-info,
    notebooks,
    tutorials
# Legacy modules kept for reference: they predate the current package
# layout and reference undefined module-level globals throughout. They
# are not imported by the package's import chain.
per-file-ignores =
    gwnr/graph/analysis_products.py:F821
    gwnr/nr/analysis/types.py:F821
    gwnr/nr/nr_waveform_sxs.py:F821
    gwnr/analysis/template_banks/*.py:F821,F632
    gwnr/analysis/template_banks/stochastic_bank/*.py:F821,F632
